spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/loginapp
    username: appuser
    password: apppass
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history
server:
  port: 8080
logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
security:
  jwt:
    # 256-bit secret (Base64 encoded)
    secret: "V40aF0Fe/JkTyLVrO79ASTYtvYIhe8fhsXFVkZr9fWs="
