spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/loginapp
    username: appuser
    password: apppass
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history
server:
  port: 8080
logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
security:
  jwt:
    # Base64 or raw secret; replace with secure value before production
    secret: "dev-secret-key-please-change-1234567890"
